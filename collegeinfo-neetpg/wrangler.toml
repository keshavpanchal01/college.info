name = "collegeinfo-neetpg"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static site (public/index.html). Only /api/* runs the Worker first.
# NOTE: data/all.csv is NOT in public/ — it is bundled into the Worker and never served as a file.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Lets the Worker `import` the private CSV as text.
[[rules]]
type = "Text"
globs = ["**/*.csv"]
fallthrough = true

# Secrets (set in Cloudflare, never in this file):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY,
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
